version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-demo
    restart: no
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  redis:
    image: redis:7
    container_name: redis
    restart: no
    ports:
      - "6379:6379"

volumes:
  pgdata:

